<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ministério de Louvor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* ── Obsidian/Chumbo + Laranja (padrão) ── */
  --bg:#141414;
  --bg2:#1c1c1c;
  --glass:rgba(255,255,255,.04);
  --glass-hover:rgba(255,255,255,.07);
  --glass-border:rgba(255,255,255,.08);
  --glass-border-lit:rgba(255,255,255,.16);

  /* ── FORJA: carvão escuro + laranja brasa + dourado ── */
  --neon-a:#e85a0a;   /* brasa */
  --neon-b:#d4a030;   /* dourado */
  --neon-c:#ff7820;   /* laranja vivo */

  --neon-a-glow:rgba(232,90,10,.52);
  --neon-b-glow:rgba(212,160,48,.35);
  --neon-c-glow:rgba(255,120,32,.4);

  --neon-a-soft:rgba(232,90,10,.12);
  --neon-b-soft:rgba(212,160,48,.09);
  --neon-c-soft:rgba(255,120,32,.1);

  --t1:#f4ede0;
  --t2:#8c7860;
  --t3:#4a3c2e;

  --r:18px;
  --r-sm:12px;
  --hh:60px;
  --fh:'Space Grotesk',sans-serif;
  --fd:'Rajdhani',sans-serif;
}

html{-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--fh);
  background:var(--bg);
  color:var(--t1);
  min-height:100vh;
  overflow-x:hidden;
}

/* ══ FUNDO ANIMADO ══ */
.bg-fx{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.bg-fx::before{
  content:'';position:absolute;
  width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,var(--neon-a-soft) 0%,transparent 70%);
  top:-160px;left:-100px;
  animation:driftA 18s ease-in-out infinite;
}
.bg-fx::after{
  content:'';position:absolute;
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,var(--neon-b-soft) 0%,transparent 70%);
  bottom:-120px;right:-80px;
  animation:driftB 22s ease-in-out infinite;
}
.bg-orb3{
  position:absolute;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,var(--neon-c-soft) 0%,transparent 70%);
  top:45%;left:45%;transform:translate(-50%,-50%);
  animation:driftC 26s ease-in-out infinite;
}
@keyframes driftA{0%,100%{transform:translate(0,0)}40%{transform:translate(60px,40px)}70%{transform:translate(-30px,70px)}}
@keyframes driftB{0%,100%{transform:translate(0,0)}35%{transform:translate(-50px,-40px)}65%{transform:translate(40px,-60px)}}
@keyframes driftC{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-45%,-55%)}}

/* scanline sutil */
.bg-fx .scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px);
  pointer-events:none;
}

/* ══ HEADER ══ */
header{
  position:sticky;top:0;z-index:200;height:var(--hh);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.1rem;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(28px) saturate(1.6);
  -webkit-backdrop-filter:blur(28px) saturate(1.6);
  border-bottom:1px solid var(--glass-border);
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--neon-a) 30%,var(--neon-b) 70%,transparent 100%);
  opacity:.5;
}

.hd-brand{display:flex;align-items:center;gap:.6rem}
.hd-gem{
  position:relative;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--neon-a),var(--neon-b));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.88rem;flex-shrink:0;
  box-shadow:0 0 18px var(--neon-a-glow),0 0 6px rgba(255,255,255,.15) inset;
}
.hd-gem::after{
  content:'';position:absolute;inset:1px;border-radius:8px;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent);
  pointer-events:none;
}
.hd-info{display:flex;flex-direction:column;gap:.05rem}
.hd-name{
  font-family:var(--fd);font-size:1rem;font-weight:700;
  letter-spacing:.06em;color:var(--t1);line-height:1;
  text-transform:uppercase;
}
.hd-date{
  font-size:.62rem;font-weight:400;color:var(--t3);
  display:flex;align-items:center;gap:.35rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:200px;
}
.hd-live{
  display:inline-flex;align-items:center;gap:.25rem;
  background:var(--neon-a-soft);border:1px solid var(--glass-border-lit);
  border-radius:20px;padding:.06rem .38rem;
  font-size:.58rem;font-weight:700;color:var(--neon-a);
  text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;
}
.hd-live-dot{width:5px;height:5px;border-radius:50%;background:var(--neon-a);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* temas */
.hd-themes{display:flex;gap:.32rem;align-items:center}
.th-btn{
  width:21px;height:21px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;outline:none;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.th-btn:active{transform:scale(.85)!important}
.th-btn.on{border-color:#fff;transform:scale(1.3);box-shadow:0 0 8px rgba(255,255,255,.4)}
.th-btn[data-t="default"]  {background:conic-gradient(from 0deg,#1a0e06,#e85a0a,#d4a030,#1a0e06)}  /* Forja */
.th-btn[data-t="charcoal"] {background:conic-gradient(from 0deg,#f0f4f2,#0a7a52,#5cbf9a,#f0f4f2)}  /* Névoa */
.th-btn[data-t="obsidian"] {background:conic-gradient(from 0deg,#050d1a,#00c8f0,#0060a0,#050d1a)}  /* Abismo */
.th-btn[data-t="clean"]    {background:conic-gradient(from 0deg,#f7f0e4,#8b1a1a,#c89640,#f7f0e4)}  /* Pergaminho */
.th-btn[data-t="slate"]    {background:conic-gradient(from 0deg,#0e1a10,#7dde3c,#3a8a30,#0e1a10)}  /* Floresta */
.th-btn[data-t="ember"]    {background:conic-gradient(from 0deg,#100818,#c060ff,#8040d0,#100818)}  /* Violeta */

/* ════════════════════════════════════════
   TEMAS — cada um com identidade própria
════════════════════════════════════════ */

/* ── NÉVOA ── branco gelo + verde menta + prata fria */
[data-theme="charcoal"]{
  --bg:#f0f4f2;--bg2:#ffffff;
  --glass:rgba(0,0,0,.03);--glass-hover:rgba(0,0,0,.055);
  --glass-border:rgba(0,0,0,.09);--glass-border-lit:rgba(0,120,80,.22);
  --neon-a:#0a7a52;--neon-b:#5cbf9a;--neon-c:#3dab7e;
  --neon-a-glow:rgba(10,122,82,.28);--neon-b-glow:rgba(92,191,154,.2);--neon-c-glow:rgba(61,171,126,.22);
  --neon-a-soft:rgba(10,122,82,.08);--neon-b-soft:rgba(92,191,154,.06);
  --t1:#0e2018;--t2:#4a7060;--t3:#9ab8a8;
}

/* ── ABISMO ── azul meia-noite + ciano elétrico + branco gelo */
[data-theme="obsidian"]{
  --bg:#050d1a;--bg2:#091526;
  --glass:rgba(255,255,255,.035);--glass-hover:rgba(255,255,255,.065);
  --glass-border:rgba(0,180,255,.12);--glass-border-lit:rgba(0,210,255,.28);
  --neon-a:#00c8f0;--neon-b:#0080c8;--neon-c:#40d8ff;
  --neon-a-glow:rgba(0,200,240,.5);--neon-b-glow:rgba(0,128,200,.35);--neon-c-glow:rgba(64,216,255,.4);
  --neon-a-soft:rgba(0,200,240,.1);--neon-b-soft:rgba(0,128,200,.07);
  --t1:#d0eeff;--t2:#5090b8;--t3:#244860;
}

/* ── PERGAMINHO ── creme quente + bordô + ouro velho (TEMA CLARO) */
[data-theme="clean"]{
  --bg:#f7f0e4;--bg2:#fdf8ef;
  --glass:rgba(120,60,0,.04);--glass-hover:rgba(120,60,0,.07);
  --glass-border:rgba(160,100,40,.18);--glass-border-lit:rgba(140,30,30,.28);
  --neon-a:#8b1a1a;--neon-b:#c89640;--neon-c:#b84020;
  --neon-a-glow:rgba(139,26,26,.25);--neon-b-glow:rgba(200,150,64,.22);--neon-c-glow:rgba(184,64,32,.22);
  --neon-a-soft:rgba(139,26,26,.08);--neon-b-soft:rgba(200,150,64,.07);
  --t1:#2a1408;--t2:#7a5030;--t3:#c4a070;
}

/* ── FLORESTA ── verde musgo escuro + lima + bege natural */
[data-theme="slate"]{
  --bg:#0e1a10;--bg2:#141f16;
  --glass:rgba(255,255,255,.03);--glass-hover:rgba(255,255,255,.06);
  --glass-border:rgba(80,180,80,.12);--glass-border-lit:rgba(120,220,80,.25);
  --neon-a:#7dde3c;--neon-b:#3a8a30;--neon-c:#a0f050;
  --neon-a-glow:rgba(125,222,60,.45);--neon-b-glow:rgba(58,138,48,.3);--neon-c-glow:rgba(160,240,80,.35);
  --neon-a-soft:rgba(125,222,60,.1);--neon-b-soft:rgba(58,138,48,.07);
  --t1:#d8f0c8;--t2:#6a9860;--t3:#385830;
}

/* ── VIOLETA ── roxo profundo + lavanda + rosa pálido */
[data-theme="ember"]{
  --bg:#100818;--bg2:#180d24;
  --glass:rgba(255,255,255,.04);--glass-hover:rgba(255,255,255,.07);
  --glass-border:rgba(180,100,255,.14);--glass-border-lit:rgba(200,140,255,.3);
  --neon-a:#c060ff;--neon-b:#8040d0;--neon-c:#e090ff;
  --neon-a-glow:rgba(192,96,255,.5);--neon-b-glow:rgba(128,64,208,.35);--neon-c-glow:rgba(224,144,255,.4);
  --neon-a-soft:rgba(192,96,255,.11);--neon-b-soft:rgba(128,64,208,.07);
  --t1:#f0e0ff;--t2:#9070b8;--t3:#504060;
}

/* ══ MAIN ══ */
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:1.2rem .9rem 4rem}

/* Animações de entrada */
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.su{animation:slideUp .45s cubic-bezier(.22,1,.36,1) both}
.su1{animation-delay:.04s}.su2{animation-delay:.1s}.su3{animation-delay:.17s}.su4{animation-delay:.24s}

/* ══ HERO ══ */
.hero{
  position:relative;overflow:hidden;
  border-radius:22px;padding:1.6rem 1.4rem 1.4rem;margin-bottom:1rem;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--neon-a-soft),transparent 55%,var(--neon-b-soft));
  pointer-events:none;
}
/* brilho no topo */
.hero::after{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--neon-a),var(--neon-b),transparent);
  opacity:.7;
}
.hero-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.hero-week-label{
  font-family:var(--fd);font-size:.75rem;font-weight:600;
  color:var(--neon-a);letter-spacing:.12em;text-transform:uppercase;
}
.nav-cluster{display:flex;align-items:center;gap:.4rem}

/* ── BOTÕES NAV — novo estilo ── */
.nav-btn{
  position:relative;
  width:36px;height:36px;border-radius:10px;
  border:1px solid var(--glass-border-lit);
  background:var(--glass);
  color:var(--t2);font-size:.78rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .2s,border-color .2s,background .2s;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--neon-a),var(--neon-b));
  opacity:0;transition:opacity .2s;
}
.nav-btn:active{transform:scale(.91);transition:transform .1s}
.nav-btn:hover{color:#fff;border-color:var(--neon-a);box-shadow:0 0 14px var(--neon-a-glow)}
.nav-btn:hover::before{opacity:.15}
.nav-btn i{position:relative;z-index:1}

.nav-sem{
  font-family:var(--fd);font-size:.78rem;font-weight:600;
  color:var(--t2);letter-spacing:.05em;min-width:56px;text-align:center;
}

.hero-title{
  font-family:var(--fd);
  font-size:clamp(1.9rem,8vw,2.8rem);font-weight:700;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;
  background:linear-gradient(120deg,#fff 20%,var(--neon-a) 55%,var(--neon-b) 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:.8rem;
}
.hero-date-chip{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.4rem .9rem;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border-lit);
  font-size:.8rem;font-weight:400;color:var(--t2);
  backdrop-filter:blur(8px);
}
.hero-date-chip i{color:var(--neon-b);font-size:.85rem}

/* ══ SECTION CARDS ══ */
.sc{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--r);
  overflow:hidden;
  margin-bottom:1rem;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .3s;
}
.sc:hover{border-color:var(--glass-border-lit)}
.sc-head{
  display:flex;align-items:center;gap:.55rem;
  padding:.85rem 1.1rem;
  border-bottom:1px solid var(--glass-border);
  background:rgba(255,255,255,.025);
}
.sc-head-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--neon-a),var(--neon-b));
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:#fff;flex-shrink:0;
  box-shadow:0 0 10px var(--neon-a-glow);
}
.sc-head-label{
  font-family:var(--fd);font-size:.75rem;font-weight:700;
  color:var(--t2);text-transform:uppercase;letter-spacing:.1em;
}
.sc-body{padding:.85rem}

/* ══ REPERTÓRIO ══ */
.rep-list{display:flex;flex-direction:column;gap:.6rem}
.rep-item{
  display:flex;flex-direction:row;align-items:flex-start;gap:.85rem;
  padding:1rem 1rem 1rem 1.1rem;
  background:rgba(255,255,255,.03);
  border:1px solid var(--glass-border);
  border-radius:var(--r-sm);
  position:relative;overflow:hidden;
  transition:border-color .25s,background .25s,transform .25s cubic-bezier(.22,1,.36,1);
  -webkit-tap-highlight-color:transparent;
  cursor:default;
}
/* linha neon esquerda */
.rep-item::before{
  content:'';position:absolute;left:0;top:12%;bottom:12%;width:2.5px;border-radius:2px;
  background:linear-gradient(180deg,var(--neon-a),var(--neon-b));
  opacity:0;transition:opacity .25s;
}
.rep-item:active{transform:translateX(4px) scale(.99)}
.rep-item:hover{
  border-color:var(--glass-border-lit);
  background:var(--neon-a-soft);
  transform:translateX(5px);
}
.rep-item:hover::before{opacity:1}

.rep-num{
  width:36px;height:36px;min-width:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--neon-a-soft),var(--neon-b-soft));
  border:1px solid var(--glass-border-lit);
  color:var(--neon-a);
  font-family:var(--fd);font-size:.82rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:.1rem;
}
/* conteúdo da música: empilha verticalmente */
.rep-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:.45rem}
.rep-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.rep-nome{font-size:.93rem;font-weight:600;color:var(--t1);line-height:1.25;flex:1;min-width:0}
.rep-tags{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;flex-shrink:0}

/* tag tom — neon pill */
.tag-tom{
  display:inline-flex;align-items:center;
  padding:.15rem .55rem;border-radius:6px;font-size:.68rem;font-weight:700;
  background:linear-gradient(90deg,var(--neon-a),var(--neon-b));
  color:#fff;letter-spacing:.04em;white-space:nowrap;
  box-shadow:0 0 8px var(--neon-a-glow);
}
.tag-seq{
  padding:.15rem .55rem;border-radius:6px;font-size:.68rem;font-weight:600;white-space:nowrap;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border-lit);
  color:var(--t2);
}
.rep-links{display:flex;gap:.45rem;flex-wrap:wrap}

/* ── BOTÕES DE LINK — novo estilo ── */
.lnk{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.28rem .7rem;border-radius:8px;
  font-size:.72rem;font-weight:600;text-decoration:none;
  border:1px solid transparent;
  transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s,opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.lnk::after{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,.07);opacity:0;transition:opacity .15s;
  pointer-events:none;
}
.lnk:active{transform:scale(.92)!important;transition:transform .08s}
.lnk:hover::after{opacity:1}
.lnk-yt{
  background:rgba(255,50,50,.08);color:#ff5555;
  border-color:rgba(255,50,50,.2);
}
.lnk-yt:hover{box-shadow:0 0 12px rgba(255,50,50,.3);transform:translateY(-2px)}
.lnk-ci{
  background:var(--neon-a-soft);color:var(--neon-a);
  border-color:var(--glass-border-lit);
}
.lnk-ci:hover{box-shadow:0 0 12px var(--neon-a-glow);transform:translateY(-2px)}
.lnk-sp{
  background:rgba(29,185,84,.08);color:#1db954;
  border-color:rgba(29,185,84,.22);
}
.lnk-sp:hover{box-shadow:0 0 12px rgba(29,185,84,.4);transform:translateY(-2px)}

/* ══ PLAYLIST AVISO ══ */
.av-playlist{
  margin-top:.55rem;display:flex;flex-direction:column;gap:.4rem;
}
.av-playlist-label{
  font-family:var(--fd);font-size:.68rem;font-weight:700;
  color:var(--neon-b);text-transform:uppercase;letter-spacing:.08em;
  display:flex;align-items:center;gap:.35rem;margin-bottom:.15rem;
}
.av-playlist-btns{display:flex;gap:.45rem;flex-wrap:wrap;}
.av-pl-btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.38rem .85rem;border-radius:9px;
  font-size:.78rem;font-weight:600;text-decoration:none;
  border:1px solid;transition:transform .2s,box-shadow .2s,opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.av-pl-btn:hover{transform:translateY(-2px);opacity:.85}
.av-pl-btn:active{transform:scale(.93)}
.av-pl-btn.yt{background:rgba(255,50,50,.1);color:#ff5555;border-color:rgba(255,50,50,.25)}
.av-pl-btn.yt:hover{box-shadow:0 0 14px rgba(255,50,50,.35)}
.av-pl-btn.sp{background:rgba(29,185,84,.1);color:#1db954;border-color:rgba(29,185,84,.25)}
.av-pl-btn.sp:hover{box-shadow:0 0 14px rgba(29,185,84,.35)}

/* ══ ESCALA ══ */
.esc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.esc-card{
  background:rgba(255,255,255,.03);border:1px solid var(--glass-border);
  border-radius:var(--r-sm);padding:.8rem .85rem;
  transition:border-color .22s;
}
.esc-card:hover{border-color:var(--glass-border-lit)}
.esc-role{
  font-family:var(--fd);font-size:.68rem;font-weight:700;
  color:var(--neon-b);text-transform:uppercase;letter-spacing:.1em;
  display:flex;align-items:center;gap:.35rem;margin-bottom:.6rem;
}
.esc-role i{font-size:.8rem}
.esc-membro{display:flex;align-items:center;gap:.45rem;margin-bottom:.3rem}
.esc-av{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(176,110,243,.2),rgba(79,195,247,.2));
  border:1px solid var(--glass-border-lit);
  color:var(--neon-a);font-family:var(--fd);font-size:.62rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.esc-nome{font-size:.85rem;font-weight:500;color:var(--t1)}
.esc-vazio{font-size:.8rem;color:var(--t3);font-style:italic}

/* ══ AVISOS ══ */
.avisos-list{display:flex;flex-direction:column;gap:.55rem}
.av-item{
  display:flex;gap:.8rem;align-items:flex-start;
  padding:.85rem .9rem;
  background:rgba(255,255,255,.03);border:1px solid var(--glass-border);
  border-radius:var(--r-sm);
  transition:border-color .22s,transform .22s cubic-bezier(.22,1,.36,1);
}
.av-item:hover{border-color:var(--glass-border-lit);transform:translateX(4px)}
.av-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;
}
.av-icon.comemorativa{background:rgba(255,215,64,.08);border:1px solid rgba(255,215,64,.22);color:#ffd740}
.av-icon.futura      {background:var(--neon-a-soft);border:1px solid var(--glass-border-lit);color:var(--neon-a)}
.av-icon.playlist    {background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.22);color:#1db954}
.av-icon.geral       {background:rgba(105,255,71,.08);border:1px solid rgba(105,255,71,.22);color:#69ff47}
.av-body{flex:1;min-width:0}
.av-titulo{font-size:.9rem;font-weight:600;color:var(--t1);margin-bottom:.22rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.av-pill{
  padding:.07rem .42rem;border-radius:5px;font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;
}
.av-pill.comemorativa{background:rgba(255,215,64,.1);color:#ffd740;border:1px solid rgba(255,215,64,.2)}
.av-pill.futura      {background:var(--neon-a-soft);color:var(--neon-a);border:1px solid var(--glass-border-lit)}
.av-pill.playlist    {background:rgba(29,185,84,.1);color:#1db954;border:1px solid rgba(29,185,84,.2)}
.av-pill.geral       {background:rgba(105,255,71,.08);color:#69ff47;border:1px solid rgba(105,255,71,.18)}
.av-desc{font-size:.83rem;color:var(--t2);line-height:1.55}
.av-date{font-size:.73rem;color:var(--t3);margin-top:.28rem;display:flex;align-items:center;gap:.3rem;font-weight:500}
.av-yt{
  display:inline-flex;align-items:center;gap:.32rem;
  margin-top:.45rem;font-size:.74rem;font-weight:600;
  color:#ff5555;text-decoration:none;
  transition:opacity .2s;
}
.av-yt:hover{opacity:.65}

/* ══ ESTADOS ESPECIAIS ══ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4.5rem 2rem;gap:1rem}
.empty-ico{
  width:70px;height:70px;border-radius:20px;
  background:var(--glass);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;color:var(--t3);
  box-shadow:0 0 30px var(--neon-a-soft) inset;
}
.empty h3{font-family:var(--fd);font-size:1rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em}
.empty p{font-size:.83rem;color:var(--t3);max-width:260px;line-height:1.55}
.loading{text-align:center;padding:5rem 2rem;color:var(--t3)}
.loading i{font-size:1.8rem;color:var(--neon-a);display:block;margin-bottom:1rem;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ FOOTER ══ */
footer{
  position:relative;z-index:1;text-align:center;
  padding:1.3rem 1rem;font-size:.7rem;color:var(--t3);
  border-top:1px solid var(--glass-border);
}
footer i{color:var(--neon-a)}

/* ══ MOBILE ══ */
@media(max-width:480px){
  header{padding:0 .9rem}
  .hd-name{font-size:.88rem}
  main{padding:1rem .75rem 3.5rem}
  .esc-grid{grid-template-columns:1fr}
  .hero-title{font-size:1.9rem}
}
@media(max-width:360px){
  .hd-date{display:none}
  .th-btn{width:19px;height:19px}
}
/* ══ MODO AVULSO ══ */
.avulso-hero{
  position:relative;overflow:hidden;
  border-radius:22px;padding:1.6rem 1.4rem 1.4rem;margin-bottom:1rem;
  background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(217,119,6,.1));
  border:1px solid rgba(245,158,11,.35);
}
.avulso-hero::after{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,#f59e0b,#fbbf24,transparent);
  opacity:.7;
}
.avulso-badge-tipo{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.25rem .8rem;border-radius:20px;
  background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.35);
  font-size:.7rem;font-weight:600;color:#f59e0b;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:.9rem;
}
.avulso-hero-title{
  font-family:var(--fd);
  font-size:clamp(1.7rem,7vw,2.4rem);font-weight:700;line-height:1.05;
  letter-spacing:.02em;text-transform:uppercase;
  background:linear-gradient(120deg,#fff 20%,#f59e0b 70%,#fbbf24 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:.8rem;
}
.avulso-date-chip{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.4rem .9rem;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(245,158,11,.25);
  font-size:.8rem;font-weight:400;color:var(--t2);
}
.avulso-date-chip i{color:#f59e0b;}
.avulso-isolado-info{
  display:flex;align-items:center;gap:.5rem;
  padding:.5rem .85rem;border-radius:10px;
  background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.18);
  font-size:.75rem;color:var(--t2);margin-top:.8rem;
}
.avulso-isolado-info i{color:#f59e0b;flex-shrink:0;}

/* ══ MODAL DE VÍDEO YOUTUBE ══ */
.yt-modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.82);

  transform:scale(1) translateY(0);
}
.yt-modal-header{

.yt-modal-actions{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.yt-modal-btn{
  width:32px;height:32px;border-radius:8px;border:none;

}
.yt-modal-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.yt-modal-close{background:rgba(255,50,50,.12);color:#ff5555;}
.yt-modal-close:hover{background:rgba(255,50,50,.28);color:#fff}

/* menu de mais opções */
.yt-more-menu{
  position:absolute;top:calc(100% + 6px);right:0;
  background:#222;border:1px solid rgba(255,255,255,.12);
  border-radius:10px;min-width:180px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  z-index:10;overflow:hidden;

  transition:transform .18s cubic-bezier(.22,1,.36,1),opacity .18s;

  transform:scale(1) translateY(0);opacity:1;pointer-events:all;
}
.yt-more-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.65rem .9rem;font-size:.82rem;font-weight:500;color:#ddd;
  cursor:pointer;transition:background .15s;text-decoration:none;
}
.yt-more-item:hover{background:rgba(255,255,255,.08);color:#fff}
.yt-more-item i{font-size:.85rem;width:16px;text-align:center;color:#aaa}
.yt-more-item:hover i{color:#fff}

/* player 16:9 */
.yt-player-wrap{
  position:relative;width:100%;padding-top:56.25%;
  background:#000;
}
.yt-player-wrap iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;
}
/* loading skeleton dentro do player */
.yt-player-loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.75rem;color:#666;font-size:.8rem;
}
.yt-player-loading i{font-size:2rem;color:#ff5555;animation:spin 1s linear infinite}

    Carregando programação…
  </div>
</main>

<footer>
  <i class="fa-solid fa-bolt"></i> Firebase Realtime &nbsp;·&nbsp; <i class="fa-solid fa-heart"></i> Ministério de Louvor
</footer>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
var CHAVE='mlTema2';
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var progs={};
var semAtual=0;
var ano=new Date().getFullYear();

function setTema(t){
  document.body.setAttribute('data-theme',t);
  localStorage.setItem(CHAVE,t);
  document.querySelectorAll('.th-btn').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
}
document.querySelectorAll('.th-btn').forEach(function(b){b.addEventListener('click',function(){setTema(b.dataset.t)})});
setTema(localStorage.getItem(CHAVE)||'default');

firebase.initializeApp({
  apiKey:"AIzaSyASRX7kZJUmp7jfx_C7buYnLfpz0reby4E",
  authDomain:"ministerio-de-louvor-e2eb3.firebaseapp.com",
  projectId:"ministerio-de-louvor-e2eb3",
  storageBucket:"ministerio-de-louvor-e2eb3.firebasestorage.app",
  messagingSenderId:"319307727923",
  appId:"1:319307727923:web:845608da8aa866ac7ecf46"
});
var db=firebase.firestore();
var col=db.collection('ministerios');

function domingoISO(a,s){
  var j4=new Date(a,0,4),d4=(j4.getDay()+6)%7;
  var seg=new Date(j4);seg.setDate(j4.getDate()-d4+(s-1)*7);
  var dom=new Date(seg);dom.setDate(seg.getDate()+6);return dom;
}
function semISO(){
  var n=new Date(),j4=new Date(n.getFullYear(),0,4),d4=(j4.getDay()+6)%7;
  var seg=new Date(j4);seg.setDate(j4.getDate()-d4);
  return Math.ceil((n-seg)/(7*864e5));
}
function fmtData(s){
  var d=domingoISO(ano,s);
  return DIAS[d.getDay()].replace(/^\w/,function(c){return c.toUpperCase()})+
    ', '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();
}
function fmtAv(s){if(!s)return'';var p=s.split('-');return p[2]?p[2]+'/'+p[1]+'/'+p[0]:p[1]+'/'+p[0]}
function chave(s){return ano+'-'+String(s).padStart(2,'0')}
function initials(n){var p=(n||'').trim().split(/\s+/);return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase()}

function navSem(d){var n=semAtual+d;if(n<1)n=1;if(n>53)n=53;renderSem(n)}
window.navegarSemana=navSem;

function setHeaderDate(s){
  var el=document.getElementById('headerDate');
  if(el)el.textContent=s?'Culto · '+fmtData(s):'—';
}

function renderSem(s){
  semAtual=s;
  setHeaderDate(s);
  var d=progs[chave(s)];
  if(!d){
    document.getElementById('conteudo').innerHTML=
      '<div class="empty su">'+
        '<div class="empty-ico"><i class="fa-solid fa-calendar-xmark"></i></div>'+
        '<h3>Sem Programação</h3>'+
        '<p>Nenhum repertório cadastrado para esta semana.</p>'+
      '</div>';
    return;
  }
  d.semana=s;
  render(d);
}

function render(d){
  var s=d.semana;
  var mesNome=MESES[d.mes]||'';
  var h='';

  /* HERO */
  h+=
    '<div class="hero su su1">'+
      '<div class="hero-nav">'+
        '<span class="hero-week-label"><i class="fa-solid fa-calendar-week"></i> &nbsp;Sem. '+s+' · '+mesNome+' '+ano+'</span>'+
        '<div class="nav-cluster">'+
          '<button class="nav-btn" onclick="navSem(-1)" aria-label="Semana anterior"><i class="fa-solid fa-chevron-left"></i></button>'+
          '<span class="nav-sem">Sem. '+s+'</span>'+
          '<button class="nav-btn" onclick="navSem(1)" aria-label="Próxima semana"><i class="fa-solid fa-chevron-right"></i></button>'+
        '</div>'+
      '</div>'+
      '<div class="hero-title">Programação<br>do Culto</div>'+
      '<div class="hero-date-chip"><i class="fa-regular fa-calendar-check"></i> '+fmtData(s)+'</div>'+
    '</div>';

  /* REPERTÓRIO */
  h+='<div class="sc su su2">'+
    '<div class="sc-head"><div class="sc-head-icon"><i class="fa-solid fa-list-music"></i></div><span class="sc-head-label">Repertório da Semana</span></div>'+
    '<div class="sc-body">';
  if(!d.repertorio||!d.repertorio.length){
    h+='<p style="color:var(--t3);font-style:italic;font-size:.85rem">Nenhuma música cadastrada.</p>';
  } else {
    h+='<div class="rep-list">';
    d.repertorio.forEach(function(m,i){
      var tags='';
      if(m.tom)tags+='<span class="tag-tom">'+m.tom+'</span>';
      if(m.seq)tags+='<span class="tag-seq">'+m.seq+'</span>';
      var lnks='';
      if(m.yt)   lnks+='<button class="lnk lnk-yt" onclick="abrirYtModal(\''+m.yt+'\',\''+( m.nome||'Música')+'\')"><i class="fa-brands fa-youtube"></i> YouTube</button>';
      if(m.sp)   lnks+='<a class="lnk lnk-sp" href="'+m.sp+'" target="_blank" rel="noopener"><i class="fa-brands fa-spotify"></i> Spotify</a>';
      if(m.cifra)lnks+='<a class="lnk lnk-ci" href="'+m.cifra+'" target="_blank" rel="noopener"><i class="fa-solid fa-music"></i> Cifra</a>';
      h+=
        '<div class="rep-item">'+
          '<span class="rep-num">'+(i+1)+'</span>'+
          '<div class="rep-content">'+
            '<div class="rep-top">'+
              '<span class="rep-nome">'+(m.nome||'—')+'</span>'+
              (tags?'<div class="rep-tags">'+tags+'</div>':'')+
            '</div>'+
            (lnks?'<div class="rep-links">'+lnks+'</div>':'')+
          '</div>'+
        '</div>';
    });
    h+='</div>';
  }
  h+='</div></div>';

  /* ESCALA */
  h+='<div class="sc su su3">'+
    '<div class="sc-head"><div class="sc-head-icon"><i class="fa-solid fa-users"></i></div><span class="sc-head-label">Escala de Serviço</span></div>'+
    '<div class="sc-body"><div class="esc-grid">';
  [
    {key:'vocal',       icon:'fa-microphone',label:'Vocal'},
    {key:'instrumental',icon:'fa-guitar',    label:'Instrumental'},
    {key:'multimidia',  icon:'fa-display',   label:'Multimídia'},
    {key:'midia',       icon:'fa-video',     label:'Mídia / Som'}
  ].forEach(function(p){
    var mbrs=d[p.key]||[];
    var cnt=!mbrs.length?'<div class="esc-vazio">Não definido</div>':
      mbrs.map(function(n){
        return '<div class="esc-membro"><div class="esc-av">'+initials(n)+'</div><span class="esc-nome">'+n+'</span></div>';
      }).join('');
    h+='<div class="esc-card"><div class="esc-role"><i class="fa-solid '+p.icon+'"></i> '+p.label+'</div>'+cnt+'</div>';
  });
  h+='</div></div></div>';

  /* AVISOS */
  var avisos=d.avisos||[];
  if(avisos.length){
    var TIPOS={
      comemorativa:{label:'Data Comemorativa',icon:'fa-star'},
      futura:{label:'Música Futura',icon:'fa-music'},
      playlist:{label:'Playlist do Dia',icon:'fa-list-music'},
      geral:{label:'Aviso Geral',icon:'fa-bullhorn'}
    };
    h+='<div class="sc su su4">'+
      '<div class="sc-head"><div class="sc-head-icon"><i class="fa-solid fa-chalkboard"></i></div><span class="sc-head-label">Quadro de Avisos</span></div>'+
      '<div class="sc-body"><div class="avisos-list">';
    avisos.forEach(function(av){
      var tipo=av.tipo||'geral';
      var inf=TIPOS[tipo]||TIPOS.geral;
      h+=
        '<div class="av-item">'+
          '<div class="av-icon '+tipo+'"><i class="fa-solid '+inf.icon+'"></i></div>'+
          '<div class="av-body">'+
            '<div class="av-titulo">'+(av.titulo||'—')+'<span class="av-pill '+tipo+'">'+inf.label+'</span></div>'+
            (av.descricao?'<div class="av-desc">'+av.descricao+'</div>':'')+
            (av.data?'<div class="av-date"><i class="fa-regular fa-calendar"></i> '+fmtAv(av.data)+'</div>':'')+
            (av.tipo==='futura'&&av.youtube?'<button class="av-yt" style="background:none;cursor:pointer;border:none;font-family:inherit;" onclick="abrirYtModal(\''+av.youtube+'\',\''+av.titulo+'\')"><i class="fa-brands fa-youtube"></i> Ver no YouTube</button>':'')+
            (av.tipo==='playlist'&&(av.playlistYt||av.playlistSp)?
              '<div class="av-playlist">'+
                '<div class="av-playlist-label"><i class="fa-solid fa-list-music"></i> Ouvir a Playlist</div>'+
                '<div class="av-playlist-btns">'+
                  (av.playlistYt?'<a class="av-pl-btn yt" href="'+av.playlistYt+'" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i> YouTube</a>':'')+
                  (av.playlistSp?'<a class="av-pl-btn sp" href="'+av.playlistSp+'" target="_blank" rel="noopener"><i class="fa-brands fa-spotify"></i> Spotify</a>':'')+
                '</div>'+
              '</div>'
            : '')+
          '</div>'+
        '</div>';
    });
    h+='</div></div></div>';
  }

  document.getElementById('conteudo').innerHTML=h;
}


/* ══ MODO AVULSO ══ */
function renderErroAvulso(msg){
  document.getElementById('conteudo').innerHTML=
    '<div class="empty su">'+
      '<div class="empty-ico"><i class="fa-solid fa-star-slash"></i></div>'+
      '<h3>Culto não encontrado</h3>'+
      '<p>'+msg+'</p>'+
    '</div>';
  document.getElementById('headerDate').textContent='—';
}

function renderAvulso(av){
  var d = av.programacao;
  var hdr = document.getElementById('headerDate');

  /* data formatada */
  var dataFmt = av.data
    ? new Date(av.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
    : '';
  if(hdr) hdr.textContent = av.nome + (dataFmt ? ' · ' + dataFmt : '');

  var h = '';

  /* HERO do avulso */
  h +=
    '<div class="avulso-hero su su1">'+
      '<div class="avulso-badge-tipo"><i class="fa-solid fa-star"></i> Culto Especial</div>'+
      '<div class="avulso-hero-title">'+av.nome+'</div>'+
      (dataFmt?'<div class="avulso-date-chip"><i class="fa-regular fa-calendar-check"></i> '+dataFmt+'</div>':'')+
      '<div class="avulso-isolado-info">'+
        '<i class="fa-solid fa-lock"></i>'+
        '<span>Programação exclusiva deste culto</span>'+
      '</div>'+
    '</div>';

  if(!d){
    h += '<div class="empty su"><div class="empty-ico"><i class="fa-solid fa-music"></i></div>'+
         '<h3>Sem programação</h3><p>O líder ainda não publicou o repertório deste culto.</p></div>';
    document.getElementById('conteudo').innerHTML = h;
    return;
  }

  /* REPERTÓRIO */
  h += '<div class="sc su su2">'+
    '<div class="sc-head"><div class="sc-head-icon"><i class="fa-solid fa-list-music"></i></div><span class="sc-head-label">Repertório</span></div>'+
    '<div class="sc-body">';
  if(!d.repertorio||!d.repertorio.length){
    h += '<p style="color:var(--t3);font-style:italic;font-size:.85rem">Nenhuma música cadastrada.</p>';
  } else {
    h += '<div class="rep-list">';
    d.repertorio.forEach(function(m,i){
      var tags='';
      if(m.tom) tags+='<span class="tag-tom">'+m.tom+'</span>';
      if(m.seq) tags+='<span class="tag-seq">'+m.seq+'</span>';
      var lnks='';
      if(m.yt)   lnks+='<button class="lnk lnk-yt" onclick="abrirYtModal(\''+m.yt+'\',\''+( m.nome||'Música')+'\')"><i class="fa-brands fa-youtube"></i> YouTube</button>';
      if(m.sp)   lnks+='<a class="lnk lnk-sp"  href="'+m.sp+'"    target="_blank" rel="noopener"><i class="fa-brands fa-spotify"></i> Spotify</a>';
      if(m.cifra)lnks+='<a class="lnk lnk-ci"  href="'+m.cifra+'" target="_blank" rel="noopener"><i class="fa-solid fa-music"></i> Cifra</a>';
      h +=
        '<div class="rep-item">'+
          '<span class="rep-num">'+(i+1)+'</span>'+
          '<div class="rep-content">'+
            '<div class="rep-top">'+
              '<span class="rep-nome">'+(m.nome||'—')+'</span>'+
              (tags?'<div class="rep-tags">'+tags+'</div>':'')+
            '</div>'+
            (lnks?'<div class="rep-links">'+lnks+'</div>':'')+
          '</div>'+
        '</div>';
    });
    h += '</div>';
  }
  h += '</div></div>';

  /* ESCALA */
  h += '<div class="sc su su3">'+
    '<div class="sc-head"><div class="sc-head-icon"><i class="fa-solid fa-users"></i></div><span class="sc-head-label">Escala de Serviço</span></div>'+
    '<div class="sc-body"><div class="esc-grid">';
  [
    {key:'vocal',       icon:'fa-microphone',label:'Vocal'},
    {key:'instrumental',icon:'fa-guitar',    label:'Instrumental'},
    {key:'multimidia',  icon:'fa-display',   label:'Multimídia'},
    {key:'midia',       icon:'fa-video',     label:'Mídia / Som'}
  ].forEach(function(p){
    var mbrs=d[p.key]||[];
    var cnt=!mbrs.length?'<div class="esc-vazio">Não definido</div>':
      mbrs.map(function(n){
        return '<div class="esc-membro"><div class="esc-av">'+initials(n)+'</div><span class="esc-nome">'+n+'</span></div>';
      }).join('');
    h+='<div class="esc-card"><div class="esc-role"><i class="fa-solid '+p.icon+'"></i> '+p.label+'</div>'+cnt+'</div>';
  });
  h += '</div></div></div>';

  /* AVISOS */
  var avisos = d.avisos||[];
  if(avisos.length){
    var TIPOS={
      comemorativa:{label:'Data Comemorativa',icon:'fa-star'},
      futura:{label:'Música Futura',icon:'fa-music'},
      playlist:{label:'Playlist do Dia',icon:'fa-list-music'},
      geral:{label:'Aviso Geral',icon:'fa-bullhorn'}
    };
    h += '<div class="sc su su4">'+
      '<div class="sc-head"><div class="sc-head-icon"><i class="fa-solid fa-chalkboard"></i></div><span class="sc-head-label">Quadro de Avisos</span></div>'+
      '<div class="sc-body"><div class="avisos-list">';
    avisos.forEach(function(av){
      var tipo=av.tipo||'geral';
      var inf=TIPOS[tipo]||TIPOS.geral;
      var playlistBtns='';
      if(av.tipo==='playlist'&&(av.playlistYt||av.playlistSp)){
        playlistBtns='<div class="av-playlist">'+
          '<div class="av-playlist-label"><i class="fa-solid fa-list-music"></i> Ouvir a Playlist</div>'+
          '<div class="av-playlist-btns">'+
            (av.playlistYt?'<a class="av-pl-btn yt" href="'+av.playlistYt+'" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i> YouTube</a>':'')+
            (av.playlistSp?'<a class="av-pl-btn sp" href="'+av.playlistSp+'" target="_blank" rel="noopener"><i class="fa-brands fa-spotify"></i> Spotify</a>':'')+
          '</div></div>';
      }
      h +=
        '<div class="av-item">'+
          '<div class="av-icon '+tipo+'"><i class="fa-solid '+inf.icon+'"></i></div>'+
          '<div class="av-body">'+
            '<div class="av-titulo">'+(av.titulo||'—')+'<span class="av-pill '+tipo+'">'+inf.label+'</span></div>'+
            (av.descricao?'<div class="av-desc">'+av.descricao+'</div>':'')+
            (av.data?'<div class="av-date"><i class="fa-regular fa-calendar"></i> '+fmtAv(av.data)+'</div>':'')+
            (av.tipo==='futura'&&av.youtube?'<button class="av-yt" style="background:none;cursor:pointer;border:none;font-family:inherit;" onclick="abrirYtModal(\''+av.youtube+'\',\''+av.titulo+'\')"><i class="fa-brands fa-youtube"></i> Ver no YouTube</button>':'')+
            playlistBtns+
          '</div>'+
        '</div>';
    });
    h += '</div></div></div>';
  }

  document.getElementById('conteudo').innerHTML = h;
}

(function(){
  var params = new URLSearchParams(window.location.search);
  var id       = params.get('id');
  var avulsoId = params.get('avulso');

  if(!id){
    document.getElementById('conteudo').innerHTML=
      '<div class="empty su">'+
        '<div class="empty-ico"><i class="fa-solid fa-link-slash"></i></div>'+
        '<h3>Link Inválido</h3>'+
        '<p>Solicite o link correto ao seu líder.</p>'+
      '</div>';
    document.getElementById('headerDate').textContent='—';
    return;
  }

  /* ── MODO AVULSO: link isolado ── */
  if(avulsoId){
    col.doc(id).get().then(function(doc){
      if(!doc.exists){ renderErroAvulso('Ministério não encontrado.'); return; }
      var data = doc.data();
      var avulsos = data.avulsos || {};
      var av = avulsos[avulsoId];
      if(!av){ renderErroAvulso('Culto não encontrado ou removido.'); return; }
      renderAvulso(av);
    }).catch(function(err){ renderErroAvulso(err.message); });
    return;
  }

  /* ── MODO NORMAL: semanas do domingo ── */
  col.doc(id).onSnapshot(function(doc){
    if(!doc.exists){
      document.getElementById('conteudo').innerHTML=
        '<div class="empty su">'+
          '<div class="empty-ico"><i class="fa-solid fa-music"></i></div>'+
          '<h3>Sem Programação</h3>'+
          '<p>Seu líder ainda não publicou o repertório.</p>'+
        '</div>';
      return;
    }
    var data=doc.data();
    if(data.programacoes&&Object.keys(data.programacoes).length){
      progs=data.programacoes;
    } else if(data.programacao){
      var p0=data.programacao;
      progs[chave(p0.semana||1)]=p0;
    }
    if(!semAtual){
      semAtual=(data.programacao||{}).semana||semISO();
    }
    renderSem(semAtual);
  },function(err){
    document.getElementById('conteudo').innerHTML=
      '<div class="empty su">'+
        '<div class="empty-ico"><i class="fa-solid fa-triangle-exclamation"></i></div>'+
        '<h3>Erro de Conexão</h3>'+
        '<p>'+err.message+'</p>'+
      '</div>';
  });
})();

/* ══ PLAYER YOUTUBE INLINE ══ */
var _ytLinkAtual = '';

function extrairYtId(url){
  if(!url) return null;
  // youtu.be/ID
  var m = url.match(/youtu\.be\/([^?&]+)/);
  if(m) return m[1];
  // youtube.com/watch?v=ID
  m = url.match(/[?&]v=([^?&]+)/);
  if(m) return m[1];
  // youtube.com/embed/ID
  m = url.match(/embed\/([^?&]+)/);
  if(m) return m[1];
  // youtube.com/shorts/ID
  m = url.match(/shorts\/([^?&]+)/);
  if(m) return m[1];
  return null;
}

function abrirYtModal(url, titulo){
  var id = extrairYtId(url);
  if(!id){
    // fallback: abrir no app direto
    window.open(url, '_blank');
    return;
  }
  _ytLinkAtual = url;
  document.getElementById('ytModalTitulo').textContent = titulo || 'Vídeo';
  document.getElementById('ytOpenApp').href = url;

  // montar iframe
  var iframe = document.getElementById('ytIframe');
  var loading = document.querySelector('.yt-player-loading');
  iframe.style.display = 'none';
  if(loading) loading.style.display = 'flex';
  iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
  iframe.onload = function(){
    if(loading) loading.style.display = 'none';
    iframe.style.display = 'block';
  };

  document.getElementById('ytModalOverlay').classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

function fecharYtModal(e){
  if(e && e.target !== document.getElementById('ytModalOverlay') && e.type !== 'click') return;
  if(e && e.currentTarget === document.getElementById('ytModalOverlay') && e.target !== e.currentTarget) return;
  var iframe = document.getElementById('ytIframe');
  iframe.src = '';
  iframe.style.display = 'none';
  document.getElementById('ytModalOverlay').classList.remove('aberto');
  document.body.style.overflow = '';
  fecharYtMore();
}

function toggleYtMore(e){
  e.stopPropagation();
  document.getElementById('ytMoreMenu').classList.toggle('aberto');
}
function fecharYtMore(){
  document.getElementById('ytMoreMenu').classList.remove('aberto');
}
function copiarLinkYt(){
  navigator.clipboard.writeText(_ytLinkAtual).then(function(){
    var btn = document.querySelector('.yt-more-menu .yt-more-item:last-child');
    if(btn){ btn.innerHTML = '<i class="fa-solid fa-check" style="color:#1db954;"></i> Copiado!'; }
    setTimeout(function(){
      fecharYtMore();
      if(btn) btn.innerHTML = '<i class="fa-solid fa-link"></i> Copiar link';
    }, 1600);
  });
}

/* fechar menu ao clicar fora */
document.addEventListener('click', function(e){
  var menu = document.getElementById('ytMoreMenu');
  var btn  = document.getElementById('ytMoreBtn');
  if(menu && !menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
    fecharYtMore();
  }
});
/* fechar modal com Escape */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') fecharYtModal();
});

</script>

<!-- Modal Player YouTube -->

  <div class="yt-modal-box" id="ytModalBox">

      <span class="yt-modal-titulo" id="ytModalTitulo">Carregando…</span>
      <div class="yt-modal-actions">

        <div style="position:relative;">
          <button class="yt-modal-btn" id="ytMoreBtn" onclick="toggleYtMore(event)" title="Mais opções">

          </button>
          <div class="yt-more-menu" id="ytMoreMenu">

              <i class="fa-brands fa-youtube" style="color:#ff5555;"></i> Abrir no YouTube
            </a>
            <div class="yt-more-item" onclick="copiarLinkYt()">

            </div>

        <button class="yt-modal-btn yt-modal-close" onclick="fecharYtModal()" title="Fechar">

    <div class="yt-player-wrap">

        id="ytIframe"

        allowfullscreen

      </iframe>
    </div>
  </div>
</div>
